name: "🔐 Secret Detection"

# ─────────────────────────────────────────────────────────────────────────────
# WHEN IT RUNS:
#   • Every push to every branch (catches secrets before they spread)
#   • Every PR targeting master or develop
#   • Manually via workflow_dispatch (for on-demand checks)
#
# WHAT IT DOES:
#   • Gitleaks scans every commit in the push for secrets, tokens, API keys
#   • Fails the pipeline immediately on any finding (no severity threshold — any
#     secret is a blocker, regardless of branch)
#   • Uploads results as SARIF → visible in GitHub Security tab
#   • Auto-creates a GitHub Issue with remediation instructions
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read        # Checkout
  security-events: write # Upload SARIF to Security tab
  issues: write         # Auto-create issues on findings

jobs:
  gitleaks:
    name: "Gitleaks — Secret Scan"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Full checkout (fetch-depth: 0 = entire git history) ──────────────
      - name: "📥 Checkout repository (full history)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Run Gitleaks ──────────────────────────────────────────────────────
      # Uses .gitleaks.toml from repo root if present (custom rules/allowlist)
      # Exit code 1 on any finding → job fails → commit is blocked
      - name: "🔍 Gitleaks scan"
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Auto-create GitHub Issue on detection ─────────────────────────────
      # Only runs if Gitleaks failed. Gives you a persistent reminder to rotate
      # the credential and clean history.
      - name: "🚨 Open issue — secret found"
        if: failure() && steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const shortSha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `## 🚨 Secret Detected — Immediate Action Required`,
              ``,
              `| Field | Value |`,
              `|---|---|`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${shortSha}\` |`,
              `| **Triggered by** | @${context.actor} |`,
              `| **Workflow run** | [View full scan results](${runUrl}) |`,
              ``,
              `### What to do RIGHT NOW`,
              `1. **Revoke / rotate** the exposed credential immediately — assume it is compromised`,
              `2. **Remove** it from the code (never just overwrite with placeholder text)`,
              `3. **Run the History Scan** workflow (\`04-history-scan.yml\`) to check if this`,
              `   secret appears in older commits too`,
              `4. If found in history, use [git-filter-repo](https://github.com/newren/git-filter-repo)`,
              `   or [BFG Repo Cleaner](https://rtyley.github.io/bfg-repo-cleaner/) to purge it`,
              `5. Force-push the cleaned history and notify anyone with a clone`,
              ``,
              `> ⚠️ Closing this issue does not fix the problem. Complete all steps above first.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [SECRET] Exposed credential in ${branch}@${shortSha}`,
              body,
              labels: ['security', 'critical', 'secret-detected'],
            });
